# Rosé Pine lock screen, laid out like the Island SDDM theme: a darker column
# on the left with the clock, date, user and password field.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock

$font = JetBrainsMono Nerd Font
$text = rgba(e0def4ff)
$subtle = rgba(908caaff)
$muted = rgba(6e6a86ff)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
    # Outline color changes (checking / wrong password / caps lock)
    animation = inputFieldColors, 1, 2, easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.2
}

# Darker column on the left holding everything (like the SDDM theme).
# Declared first so the rest draws on top of it.
shape {
    monitor =
    size = 460, 1440
    color = rgba(191724b8)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font ExtraBold
    position = 56, 150
    halign = left
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $subtle
    font_size = 20
    font_family = $font
    position = 56, 75
    halign = left
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $text
    font_size = 18
    font_family = $font Bold
    position = 56, 5
    halign = left
    valign = center
}

# Password field — thin solid outline: grey, iris while checking, love on failure
input-field {
    monitor =
    size = 348, 54
    rounding = 12
    outline_thickness = 2
    inner_color = rgba(191724cc)
    outer_color = rgba(524f67ff)
    check_color = rgba(c4a7e7ff)
    fail_color = rgba(eb6f92ff)
    capslock_color = rgba(f6c177ee)
    font_color = $text
    font_family = $font
    placeholder_text = <span foreground="##6e6a86">password</span>
    fail_text = <span foreground="##eb6f92">$PAMFAIL</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = false
    position = 56, -50
    halign = left
    valign = center
}

# Now playing, along the bottom of the column
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/nowplaying.sh
    color = $muted
    font_size = 13
    font_family = $font
    position = 56, 40
    halign = left
    valign = bottom
}
