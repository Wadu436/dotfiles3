# Rosé Pine lock screen, styled after the Quickshell island.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock

$font = JetBrainsMono Nerd Font
$text = rgba(e0def4ff)
$subtle = rgba(908caaff)
$muted = rgba(6e6a86ff)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 5, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 120
    font_family = $font ExtraBold
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $subtle
    font_size = 20
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

# Password field — thin solid outline: grey, iris while checking, love on failure
input-field {
    monitor =
    size = 340, 54
    rounding = 12
    outline_thickness = 2
    inner_color = rgba(191724cc)
    outer_color = rgba(524f67ff)
    check_color = rgba(c4a7e7ff)
    fail_color = rgba(eb6f92ff)
    capslock_color = rgba(f6c177ee)
    font_color = $text
    font_family = $font
    placeholder_text = <span foreground="##6e6a86">locked</span>
    fail_text = <span foreground="##eb6f92">$PAMFAIL</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    position = 0, -40
    halign = center
    valign = center
}

# Now playing
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/nowplaying.sh
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 60
    halign = center
    valign = bottom
}
