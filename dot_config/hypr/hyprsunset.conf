# Night light schedule (hyprsunset). The Quickshell dashboard's "Night light"
# toggle overrides this until the next profile switch.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset

# Daytime: neutral. 6500K rather than identity so the current state can be
# read back (`hyprctl hyprsunset temperature` doesn't report identity).
profile {
    time = 7:00
    temperature = 6500
}

# Evening: warm
profile {
    time = 20:00
    temperature = 4000
}
